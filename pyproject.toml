[project]
name = "ai-me"
version = "0.1.0"
description = "AI-powered CLI tool for developers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic-ai>=1.80.0",
    "pydantic-settings[toml]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ai = "ai_me.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_me"]

[tool.hatch.build.targets.sdist]
include = ["src/ai_me"]
